<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Feedback Slips</title>
<style>
  /* Paper feedback slips for Class Games. The questions come from js/feedback-def.js —
     the same list as the 💬 Give feedback panel in Code Studio, in the same order. */
  :root{ --ink:#1f2340; --muted:#5d6385; --line:#c9cede; --soft:#f3f5fb; --brand:#4b4bc8; }
  *{box-sizing:border-box}
  body{margin:0;background:#e9eef8;color:var(--ink);font:14px/1.3 "Helvetica Neue",Helvetica,Arial,sans-serif}
  .bar{display:flex;gap:10px;align-items:center;justify-content:center;padding:12px 16px;flex-wrap:wrap}
  .bar button{font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--brand);color:#fff;padding:10px 16px;cursor:pointer}
  .bar p{margin:0;color:var(--muted)}
  .page{width:11in;height:8.45in;margin:0 auto 16px;background:#fff;padding:.3in .3in;display:flex;flex-direction:row;gap:.4in;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .slip{flex:1;border:2px solid var(--ink);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
  .slip + .slip::before{content:"✂";position:absolute;left:-.29in;top:-2px;color:#999;font-size:13px}
  .slip + .slip::after{content:"";position:absolute;left:-.21in;top:18px;bottom:0;border-left:1.5px dashed #bbb}
  .top{display:flex;align-items:baseline;gap:10px}
  .top h1{font-size:17px;margin:0}
  .top small{color:var(--muted)}
  .who{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px}
  .who div:first-child{grid-column:1/-1}
  .who div{border-bottom:1.5px solid var(--ink);padding-top:14px}
  h2{font-size:11.5px;margin:3px 0 0;color:var(--brand);text-transform:uppercase;letter-spacing:.03em}
  table{width:100%;border-collapse:collapse}
  td{padding:2px 0;border-bottom:1px solid var(--soft);vertical-align:middle}
  td.q{font-size:12px;line-height:1.15}
  td.q small{color:var(--muted);font-size:10px;display:block}
  td.ico{width:24px;font-size:15px;text-align:center}
  .ans{margin-left:6px}.ans .box{margin:0 2px 0 0}
  .key{margin:1px 0 2px}
  td.yn{width:140px;text-align:right;white-space:nowrap;font-size:12px}
  .box{display:inline-block;width:14px;height:14px;border:1.5px solid var(--ink);border-radius:3px;vertical-align:-3px;margin:0 3px 0 8px}
  .stars{font-size:17px;letter-spacing:4px;color:#9aa0b8;white-space:nowrap;text-align:right}
  .levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
  .levels span{border:1.5px solid var(--line);border-radius:10px;padding:3px 2px;font-size:10px;color:var(--muted);line-height:1.15}
  .levels b{display:block;font-size:16px;color:var(--ink)}
  .tip{font-size:10.5px;color:var(--muted);margin:0}
  .line{font-size:12px;margin-top:2px}
  .line small{color:var(--muted)}
  .write{border-bottom:1.5px solid var(--ink);height:24px}
  @media print{
    @page{size:letter landscape;margin:0}
    body{background:#fff}
    .bar{display:none}
    .page{margin:0;box-shadow:none;page-break-after:always}
  }
  @media screen and (max-width:1100px){ .page{width:100%;height:auto} }
</style>
</head>
<body>
<div class="bar">
  <p>Two slips per page (landscape). Students copy their slip into Code Studio → 🏅 Class Games → a game → 💬 Give feedback.</p>
  <label>Pages <input id="pages" type="number" min="1" max="40" value="1" style="width:56px"></label>
  <button type="button" onclick="window.print()">🖨 Print</button>
</div>
<div id="out"></div>
<script src="js/feedback-def.js"></script>
<script>
(function(){
  const F = window.FEEDBACK;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  function slip(){
    return `<section class="slip">
      <div class="top"><h1>💬 Game Feedback Slip</h1><small>Tarjeta de comentarios del juego</small></div>
      <div class="who"><div>Me · Yo:</div><div>Game · Juego:</div><div>Made by · Hecho por:</div></div>
      <h2>1 · Does it work? How well? · ¿Funciona? ¿Qué tan bien?</h2>
      <p class="tip key">Check one box: ${F.answers.map(a => `${a.icon} ${esc(a.en)} · ${esc(a.es)}`).join(' &nbsp; ')}</p>
      <table>${F.checks.map(c => `<tr><td class="ico">${c.icon}</td><td class="q">${esc(c.en)}<small>${esc(c.es)}</small></td>
        <td class="yn">${F.answers.map(a => `<span class="ans"><span class="box"></span>${a.icon}</span>`).join('')}</td></tr>`).join('')}</table>
      <h2>2 · Stars — color in 1 to 4 · Estrellas — colorea de 1 a 4</h2>
      <table>${F.ratings.map(r => `<tr><td class="ico">${r.icon}</td><td class="q">${esc(r.en)}<small>${esc(r.es)}</small></td>
        <td class="stars">☆☆☆☆</td></tr>`).join('')}</table>
      <h2>3 · I think this game is at level… (circle one) · Creo que está en el nivel… (encierra uno)</h2>
      <div class="levels">${F.levels.map(l => `<span><b>${l.n}</b>${esc(l.en)}<br>${esc(l.es)}</span>`).join('')}</div>
      <p class="tip">Each level needs every ✓ above it: 1 = 🕹 · 2 = 🕹👾 · 3 = 🕹👾💀🏆 · 4 = all 7 ✓ · Cada nivel necesita todos los ✓ de antes.</p>
      <h2>4 · Comments · Comentarios</h2>
      ${F.texts.map(x => `<div class="line">${x.icon} <b>${esc(x.en)}</b> <small>· ${esc(x.es)}</small></div><div class="write"></div>`).join('')}
    </section>`;
  }
  const out = document.getElementById('out'), pages = document.getElementById('pages');
  function draw(){
    const n = Math.max(1, Math.min(40, Number(pages.value) || 1));
    out.innerHTML = Array.from({ length:n }, () => `<div class="page">${slip()}${slip()}</div>`).join('');
  }
  pages.oninput = draw;
  draw();
})();
</script>
</body>
</html>
